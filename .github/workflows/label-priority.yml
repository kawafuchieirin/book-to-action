name: 優先度ラベルを付ける

# 読みたい本Issueのフォームで選んだ優先度を、そのままラベルに反映する。
# ラベルになっていればIssue一覧で絞り込めるし、sync-want-to-read.sh が読み取れる。

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    if: contains(github.event.issue.labels.*.name, 'want-to-read')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const PRIORITY_LABELS = ['🔥 今すぐ', '🌱 そのうち', '🧊 一応メモ'];

            // Issueフォームは「### 優先度」の次の段落に選択値を書き出す
            const body = context.payload.issue.body || '';
            const section = body.split(/^###\s+優先度\s*$/m)[1] || '';
            const selected = section.split('\n').map(l => l.trim()).find(l => l && l !== '_No response_');

            const wanted = PRIORITY_LABELS.find(label => selected && selected.startsWith(label.slice(0, 2)));
            if (!wanted) {
              core.info(`優先度を読み取れませんでした: ${JSON.stringify(selected)}`);
              return;
            }

            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const current = context.payload.issue.labels.map(l => l.name);

            for (const stale of PRIORITY_LABELS.filter(l => l !== wanted && current.includes(l))) {
              await github.rest.issues.removeLabel({ ...issue, name: stale });
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({ ...issue, labels: [wanted] });
            }
